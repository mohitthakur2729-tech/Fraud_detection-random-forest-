<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>UPI Fraud Detection</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="../static/img/favicon.svg" rel="icon" type="image/svg+xml">
  <link href="../static/img/apple-touch-icon.svg" rel="apple-touch-icon" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e27">

  <!-- Vendor CSS Files -->
  <link href="../static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../static/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Modern Theme CSS -->
  <link href="../static/css/modern-theme.css" rel="stylesheet">

  <style>
    .upload-zone {
      position: relative;
      overflow: hidden;
      transition: var(--transition);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 2;
    }

    .upload-zone .upload-icon {
      font-size: 4rem;
      color: var(--accent-cyan);
      margin-bottom: 1.5rem;
      transition: var(--transition);
    }

    .upload-zone:hover .upload-icon {
      transform: scale(1.1);
      filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.5));
    }

    .file-name {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--accent-cyan);
      min-height: 24px;
    }
  </style>
</head>

<body>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Header -->
  <header id="header" class="fixed-top d-flex align-items-center">
    <div class="container-fluid container-xl d-flex align-items-center justify-content-lg-between">
      <h1 class="logo"><a href="{{ url_for('first') }}"><span>UPI</span> Fraud Detection</a></h1>

      <nav id="navbar" class="navbar order-last order-lg-0">
        <ul>
          <li><a class="nav-link" href="{{ url_for('first') }}">Home</a></li>
          <li><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
          <li><a class="nav-link active" href="{{ url_for('upload') }}">Upload</a></li>
          <li><a class="nav-link" href="{{ url_for('prediction1') }}">Check</a></li>
          <li><a class="nav-link" href="{{ url_for('chart') }}">Chart</a></li>
        </ul>
        <i class="bi bi-list mobile-nav-toggle"></i>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="d-flex align-items-center justify-content-center" style="min-height: 50vh;">
    <canvas id="particle-canvas"></canvas>
    <div class="container position-relative" style="z-index: 2;">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="section-title" data-animate>
            <h2>Upload Dataset</h2>
            <p>Upload your transaction dataset for analysis and model training</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Upload Section -->
  <section class="pb-5" style="margin-top: -100px; position: relative; z-index: 3;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6" data-animate data-delay="200">
          <form action="/preview" name="fs" id="fs" method="post" enctype="multipart/form-data">
            <div class="upload-zone glass-card" id="dropZone">
              <input type="file" name="datasetfile" id="file1" accept=".csv,text/csv" required onchange="showFileName(this)">
              <i class="bi bi-cloud-arrow-up upload-icon"></i>
              <h4 style="color: var(--text-primary); margin-bottom: 0.5rem;">Drag & Drop or Click to Upload</h4>
              <p style="color: var(--text-muted); font-size: 0.9rem;">Supported format: CSV transaction dataset</p>
              <div class="file-name" id="fileName"></div>
            </div>

            <div class="text-center mt-4">
              <button type="submit" class="btn-primary">
                <i class="bi bi-upload"></i> Upload Dataset
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="footer">
    <div class="container">
      <div class="copyright">
        &copy; <strong><span>UPI Fraud Detection</span></strong>. All Rights Reserved.
      </div>
    </div>
  </footer>

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Modern Animations -->
  <script src="../static/js/animations.js"></script>

  <script>
    function showFileName(input) {
      const fileName = document.getElementById('fileName');
      if (input.files && input.files.length > 0) {
        fileName.textContent = 'Selected: ' + input.files[0].name;
      }
    }

    // Drag and drop visual feedback
    const dropZone = document.getElementById('dropZone');
    if (dropZone) {
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--accent-cyan)';
        dropZone.style.background = 'rgba(0, 242, 255, 0.05)';
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = 'var(--border-glass)';
        dropZone.style.background = 'var(--bg-card)';
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = 'var(--border-glass)';
        dropZone.style.background = 'var(--bg-card)';
      });
    }
  </script>
</body>

</html>
