  <script type="text/javascript">
    google.charts.load("current", { packages: ['corechart', 'line'] });
    google.charts.setOnLoadCallback(drawColumnChart);
    google.charts.setOnLoadCallback(drawPieChart);
    google.charts.setOnLoadCallback(drawAccuracyChart);

    function drawColumnChart() {
      var data = google.visualization.arrayToDataTable([
        ["states", "percentage", { role: "style" }],
        ["Free_Money", 182, "#00FFFF"],
        ["Stalking", 175, "#DF01A5"],
        ["Investment", 160, "#FF0000"],
        ["Job_Opening", 154, "color: #FFBF00"]
      ]);

      var view = new google.visualization.DataView(data);
      view.setColumns([0, 1,
        {
          calc: "stringify",
          sourceColumn: 1,
          type: "string",
          role: "annotation"
        },
        2]);

      var options = {
        title: "",
        width: 600,
        height: 400,
        bar: { groupWidth: "95%" },
        legend: { position: "none" },
      };
      var chart = new google.visualization.ColumnChart(document.getElementById("columnchart_values"));
      chart.draw(view, options);
    }

    function drawPieChart() {
      var data = google.visualization.arrayToDataTable([
        ['Type', 'percentage'],
        ['Fraud', 35],
        ['Real', 75]
      ]);

      var options = {
        title: '',
        is3D: true,
      };

      var chart = new google.visualization.PieChart(document.getElementById('piechart_3d'));
      chart.draw(data, options);
    }

    function drawAccuracyChart() {
      var data = new google.visualization.DataTable();
      data.addColumn('string', 'Month');
      data.addColumn('number', 'Training_Accuracy');
      data.addColumn('number', 'Testing_Accuracy');

      data.addRows([
        ['10', 0.75, 0.74],
        ['20', 0.82, 0.81],
        ['30', 0.85, 0.86],
        ['40', 0.92, 0.93],
        ['50', 0.995, 0.998],
      ]);

      var options = {
        'title': '',
        hAxis: {
          title: 'Epoches'
        },
        vAxis: {
          title: 'Accuracy'
        },
        'width': 550,
        'height': 400
      };

      var chart = new google.visualization.LineChart(document.getElementById('container'));
      chart.draw(data, options);
    }
  </script>
